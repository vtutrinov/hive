# Minimal log4j2 config for the HMS test container -- console only, INFO level.
status = INFO
name = MetastoreTestLog

appenders = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%t] %c{1.}: %m%n

rootLogger.level = INFO
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = console

# Quiet down very chatty packages
logger.datanucleus.name = DataNucleus
logger.datanucleus.level = WARN
logger.jdo.name = javax.jdo
logger.jdo.level = WARN
logger.bonecp.name = com.jolbox.bonecp
logger.bonecp.level = WARN
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = WARN
